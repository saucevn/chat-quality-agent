# Build tài liệu VitePress trong docs/ và publish lên GitHub Pages.
#
# Site: https://saucevn.github.io/chat-quality-agent/
# Base path khớp với `base` trong docs/.vitepress/config.ts — đổi tên repo thì
# phải đổi cả hai chỗ, nếu không CSS và ảnh sẽ 404.
#
# YÊU CẦU MỘT LẦN: Settings > Pages > Source = "GitHub Actions".
# Chưa bật thì job deploy thất bại ở bước deploy-pages.

name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Không huỷ giữa chừng: một lần deploy bị cắt ngang có thể để site ở trạng thái dở.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install and build
        working-directory: docs
        run: |
          npm ci
          npm run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
