# Dùng file này nếu bạn muốn dùng image có sẵn từ Docker Hub
# thay vì build từ source code.
#
# Cách dùng:
#   1. Tải file này và .env.example về cùng thư mục
#   2. Sao chép .env.example thành .env và điền thông tin
#   3. docker compose -f docker-compose.hub.yml up -d
#
# Image do tài khoản Docker Hub `buitanviet` phát hành. Nếu bạn không có quyền
# đẩy image lên đó, dùng docker-compose.yml (build từ source) thay cho file này.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: buitanviet/chat-quality-agent-nginx:latest
    container_name: cqa-nginx
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - LEGO_DOMAIN=${LEGO_DOMAIN:-}
      - LEGO_EMAIL=${LEGO_EMAIL:-}
    volumes:
      - lego_certs:/etc/lego
      - lego_webroot:/var/www/acme
    depends_on:
      # Chờ app healthy chứ không chỉ "đã tạo": nginx lên sớm thì mọi request
      # trong lúc app còn migrate đều rơi vào 502.
      app:
        condition: service_healthy
    mem_limit: 128m
    logging: *default-logging

  app:
    image: buitanviet/chat-quality-agent:latest
    container_name: cqa-app
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      # Sáu biến dưới cố tình đặt ở đây chứ không để .env quyết định — trong
      # container chúng chỉ có đúng một giá trị hợp lệ. Riêng SERVER_HOST:
      # config.go:39 mặc định 127.0.0.1, quên khai trong .env là nginx 502.
      - APP_ENV=production
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - DB_HOST=db
      - DB_PORT=3306
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - file_storage:/var/lib/cqa/files
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # wget có sẵn trong busybox của alpine, không phải thêm gói vào image.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    logging: *default-logging

  db:
    image: mysql:8.0
    container_name: cqa-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-cqa}
      MYSQL_USER: ${DB_USER:-cqa}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-3306}:3306"
    healthcheck:
      # Phải có -p: `mysqladmin ping` không mật khẩu vẫn thoát 0 khi auth lỗi,
      # tức là healthy giả.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=128M
      --performance-schema=OFF
      --skip-name-resolve
    mem_limit: 768m
    logging: *default-logging

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: cqa-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_LABEL_ENABLE=true
      - DOCKER_API_VERSION=1.40
    mem_limit: 128m
    logging: *default-logging

volumes:
  mysql_data:
  file_storage:
  lego_certs:
  lego_webroot:
